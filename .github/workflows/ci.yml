name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 构建与单元/集成测试
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检测 gcc（缺失则安装 MinGW）
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            foreach ($p in @('C:\ProgramData\mingw64\mingw64\bin','C:\mingw64\bin','C:\msys64\mingw64\bin')) {
              if (Test-Path "$p\gcc.exe") { $env:Path = "$p;$env:Path"; break }
            }
          }
          gcc --version
      - name: 构建并运行 20 个单元测试
        shell: pwsh
        run: powershell -File scripts/build.ps1
      - name: 快速集成实验
        shell: pwsh
        run: |
          $env:LAB_TEST_PASSWORD = 'Ci-Only-Password-77'
          python tests/integration.py --quick --output tests/results-ci
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results-ci/
          if-no-files-found: ignore

  static-analysis:
    name: 静态分析门禁
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 检测 gcc（缺失则安装 MinGW）
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            foreach ($p in @('C:\ProgramData\mingw64\mingw64\bin','C:\mingw64\bin','C:\msys64\mingw64\bin')) {
              if (Test-Path "$p\gcc.exe") { $env:Path = "$p;$env:Path"; break }
            }
          }
          gcc --version
      - name: gcc -fanalyzer 静态分析
        shell: pwsh
        run: powershell -File scripts/build.ps1 -Analyze

  asan-memory:
    name: ASan 内存安全通道（MSYS2）
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # MSYS2/MinGW 的 gcc 与 clang 均不打包 ASan 运行库（msys2#11899）；
      # llvm-mingw 是 Windows 上带完整 ASan/UBSan 的工具链。
      - name: 安装 llvm-mingw 工具链
        shell: bash
        run: |
          # 经 releases/latest 重定向取最新 tag（不调用 API，避免匿名限流）
          TAG=$(curl -sI https://github.com/mstorsjo/llvm-mingw/releases/latest | grep -i '^location:' | sed 's#.*/tag/##' | tr -d '\r\n')
          echo "llvm-mingw tag: $TAG"
          curl -sL -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/${TAG}/llvm-mingw-${TAG}-ucrt-x86_64.zip"
          mkdir -p /c/llvm-mingw
          powershell -NoProfile -Command "Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\\llvm-mingw -Force"
          echo "/c/llvm-mingw/llvm-mingw-${TAG}-ucrt-x86_64/bin" >> $GITHUB_PATH
      - name: 构建 ASan 单元测试
        shell: bash
        run: |
          mkdir -p build
          # 不定义 _GNU_SOURCE：mingw 头文件会据此把 clock_gettime 重定向到
          # clock_gettime64，llvm-mingw 的 ucrt 运行库无该符号，链接失败。
          x86_64-w64-mingw32-gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DNO_SSL -DNO_CGI -DSQLITE_THREADSAFE=1 -DWATCHDOG_MS=50 \
            -Isrc -Ivendor/civetweb/include -Ivendor/cjson -Ivendor/sqlite -Ivendor/sodium/libsodium-win64/include -Ivendor/unity/src \
            vendor/unity/src/unity.c src/util.c src/db.c src/service.c src/ratelimit.c src/log.c tests/unit.c \
            vendor/civetweb/src/civetweb.c vendor/cjson/cJSON.c vendor/sqlite/sqlite3.c \
            -Lvendor/sodium/libsodium-win64/lib -lsodium -lws2_32 -ladvapi32 -lwinpthread -o build/asan-unit.exe
      - name: 运行 ASan 单元测试
        shell: bash
        run: |
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 ./build/asan-unit.exe
